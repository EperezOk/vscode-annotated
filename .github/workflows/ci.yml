name: CI
on:
  push:
    branches: [main]
    # Skip docs-only pushes. Deliberately NOT ignoring skills/**/*.md — the
    # skill-contract unit test keeps those docs in lockstep with the code.
    paths-ignore:
      - 'docs/**'
      - 'media/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - '.gitignore'
      - '.vscodeignore'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-types
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-artifacts
          path: test-results/
          if-no-files-found: ignore
